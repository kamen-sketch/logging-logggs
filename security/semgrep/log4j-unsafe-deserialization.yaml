rules:
  - id: log4j-unsafe-deserialization
    mode: taint
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      category: security
      confidence: HIGH
      references:
        - https://nvd.nist.gov/vuln/detail/CVE-2019-17571
      grounding: >-
        Log4j's socket/JMS receivers accept serialized log events; CVE-2019-17571
        was exactly this sink reachable from a network stream.
    message: >-
      A stream that is not provably trusted is deserialized with
      ObjectInputStream.readObject(). Deserialization instantiates arbitrary
      classes on the classpath and is exploitable before any type check the
      caller performs. Use a structured format (JSON/XML) for log transport, or
      constrain the stream with an ObjectInputFilter before calling readObject().

    pattern-sources:
      - pattern: (java.net.Socket $S).getInputStream()
      - pattern: (java.net.ServerSocket $S).accept().getInputStream()
      - pattern: (java.net.HttpURLConnection $C).getInputStream()
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., java.io.InputStream $IN, ...) { ... }
          - pattern: $IN
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., byte[] $B, ...) { ... }
          - pattern: $B

    pattern-sanitizers:
      # Constructing an ObjectInputStream is harmless by itself; the danger is
      # calling readObject() on one that was never filtered. setObjectInputFilter
      # is a void call that mutates the *future* safety of its receiver rather
      # than returning a cleaned value, so by-side-effect marks $OIS itself
      # un-tainted for everything after this call in the same scope.
      - patterns:
          - pattern: $OIS.setObjectInputFilter(...)
        by-side-effect: true

    pattern-sinks:
      # The sink is the readObject() call, not the constructor: the taint that
      # matters is on the ObjectInputStream receiver itself (it was built from
      # an untrusted stream), which is why focus-metavariable targets $OIS
      # rather than an argument -- readObject() takes none.
      - patterns:
          - pattern: $OIS.readObject()
          - focus-metavariable: $OIS
