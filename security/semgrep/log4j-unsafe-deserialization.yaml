rules:
  - id: log4j-unsafe-deserialization
    mode: taint
    languages: [java]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      category: security
      confidence: HIGH
      references:
        - https://nvd.nist.gov/vuln/detail/CVE-2019-17571
      grounding: >-
        Log4j's socket/JMS receivers accept serialized log events; CVE-2019-17571
        was exactly this sink reachable from a network stream.
    message: >-
      A stream that is not provably trusted is deserialized with
      ObjectInputStream.readObject(). Deserialization instantiates arbitrary
      classes on the classpath and is exploitable before any type check the
      caller performs. Use a structured format (JSON/XML) for log transport, or
      constrain the stream with an ObjectInputFilter.

    pattern-sources:
      - pattern: (java.net.Socket $S).getInputStream()
      - pattern: (java.net.ServerSocket $S).accept().getInputStream()
      - pattern: (java.net.HttpURLConnection $C).getInputStream()
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., java.io.InputStream $IN, ...) { ... }
          - pattern: $IN
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., byte[] $B, ...) { ... }
          - pattern: $B

    pattern-sanitizers:
      # A filter constrains which classes may be instantiated.
      - pattern: $OIS.setObjectInputFilter(...)
      - pattern: java.io.ObjectInputFilter.Config.createFilter($SPEC)

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new java.io.ObjectInputStream($STREAM)
              - pattern: new java.io.ObjectInputStream(new java.io.ByteArrayInputStream($STREAM))
          - focus-metavariable: $STREAM
